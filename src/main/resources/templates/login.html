<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>
<div class="auth-page">
    <div class="glass-container auth-card">
        <div class="auth-header">
            <a href="/" style="text-decoration: none;">
                <h2 class="logo"
                    style="background: linear-gradient(to right, var(--primary), var(--secondary));-webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                    RevHire</h2>
            </a>
            <h2>Welcome Back</h2>
            <p>Login to your account</p>
        </div>

        <div th:if="${param.error}" class="error-text" style="text-align: center; margin-bottom: 1rem;">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" style="text-align: center; margin-bottom: 1rem; color: var(--success);">
            You have been logged out.
        </div>
        <div th:if="${param.registered}" style="text-align: center; margin-bottom: 1rem; color: var(--success);">
            Registration successful! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="username" class="form-control" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Sign Up</a>
        </div>
    </div>
</div>
</body>

</html>
