<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="glass-container auth-card">
            <div class="auth-header">
                <a href="/" style="text-decoration: none;">
                    <h2 class="logo"
                        style="background: linear-gradient(to right, var(--primary), var(--secondary));-webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                        RevHire</h2>
                </a>
                <h2>Forgot Password</h2>
                <p>Enter your email to receive a reset link</p>
            </div>

            <div th:if="${error}" class="alert error-text" style="text-align: center; margin-bottom: 1rem;">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="alert"
                style="text-align: center; margin-bottom: 1rem; color: var(--success);">
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@company.com"
                        required>
                </div>
                <button type="submit" class="btn btn-primary">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                Remember your password? <a th:href="@{/login}">Login</a>
            </div>
        </div>
    </div>
</body>

</html>
