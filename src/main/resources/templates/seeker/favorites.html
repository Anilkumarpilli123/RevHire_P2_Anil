<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
    </style>
</head>

<body>
    <div th:replace="~{common/fragments :: mobile-header('seeker')}"></div>
    <div th:replace="~{common/fragments :: sidebar-overlay}"></div>
    <div class="container">
        <div th:replace="~{common/fragments :: seeker-sidebar('favorites')}"></div>

        <main class="main-content">
            <h1>Your Saved Jobs</h1>
            <p style="color: #94a3b8; margin-bottom: 3rem;">Opportunities you're keeping an eye on.</p>

            <div th:each="fav : ${favorites}" class="job-card-compact">
                <div class="job-card-info">
                    <div style="display: flex; align-items: baseline;">
                        <h4 th:text="${fav.job.title}">Job Title</h4>
                        <span class="company" th:text="${fav.job.company.name}"
                            style="margin-left: 1rem;">Company</span>
                    </div>
                </div>
                <div class="job-card-actions">
                    <form th:action="@{'/seeker/jobs/' + ${fav.job.id} + '/favorite'}" method="post"
                        style="display: inline;">
                        <input type="hidden" name="redirect" value="/seeker/favorites">
                        <button type="submit" class="btn btn-outline"
                            style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--error); border-color: var(--error);">Remove</button>
                    </form>
                    <a th:href="@{'/seeker/jobs/' + ${fav.job.id}}" class="btn btn-primary"
                        style="width: auto; padding: 0.5rem 1.5rem; font-size: 0.85rem;">View Details</a>
                </div>
            </div>

            <div th:if="${favorites.empty}" style="text-align: center; padding: 4rem;">
                <p style="color: #94a3b8;">No saved jobs yet.</p>
                <a href="/seeker/jobs" class="btn btn-primary" style="margin-top: 1rem; width: auto;">Browse Jobs</a>
            </div>
        </main>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
