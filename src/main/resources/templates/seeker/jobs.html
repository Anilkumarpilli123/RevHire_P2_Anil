<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .search-bar {
            background: var(--glass-heavy);
            padding: 2rem;
            border-radius: 24px;
            margin-bottom: 3rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div th:replace="~{common/fragments :: mobile-header('seeker')}"></div>
    <div th:replace="~{common/fragments :: sidebar-overlay}"></div>
    <div class="container">
        <div th:replace="~{common/fragments :: seeker-sidebar('jobs')}"></div>

        <main class="main-content">
            <h1>Browse Opportunities</h1>
            <p style="color: #94a3b8; margin-bottom: 2rem;">Find the perfect match for your skills and career goals.</p>

            <form th:action="@{/seeker/jobs}" method="get" class="search-bar"
                style="flex-direction: column; align-items: stretch; gap: 1.5rem;">
                <div class="dashboard-grid" style="gap: 1.5rem; margin-top: 0;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Job
                            Title / Keywords</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Software Engineer"
                            th:value="${param.title}">
                    </div>
                    <div>
                        <label
                            style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Location</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g. Remote"
                            th:value="${param.location}">
                    </div>
                </div>
                <div class="dashboard-grid" style="gap: 1.5rem; margin-top: 0;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Company
                            Name</label>
                        <input type="text" name="companyName" class="form-control" placeholder="e.g. Google"
                            th:value="${param.companyName}">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Max
                            Experience</label>
                        <input type="number" name="experience" class="form-control" placeholder="Years"
                            th:value="${param.experience}">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Job
                            Type</label>
                        <select name="jobType" class="form-control">
                            <option value="">All Types</option>
                            <option value="FULL_TIME" th:selected="${param.jobType == 'FULL_TIME'}">Full Time</option>
                            <option value="PART_TIME" th:selected="${param.jobType == 'PART_TIME'}">Part Time</option>
                            <option value="CONTRACT" th:selected="${param.jobType == 'CONTRACT'}">Contract</option>
                            <option value="INTERNSHIP" th:selected="${param.jobType == 'INTERNSHIP'}">Internship
                            </option>
                            <option value="REMOTE" th:selected="${param.jobType == 'REMOTE'}">Remote</option>
                        </select>
                    </div>
                    <div class="dashboard-grid"
                        style="gap: 1.5rem; margin-top: 0; grid-template-columns: repeat(3, 1fr);">
                        <div>
                            <label
                                style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Salary
                                Range</label>
                            <input type="text" name="salaryRange" class="form-control" placeholder="e.g. 100k - 150k"
                                th:value="${param.salaryRange}">
                        </div>
                        <div>
                            <label
                                style="display: block; margin-bottom: 0.5rem; font-size: 0.8rem; color: #94a3b8;">Posted
                                Within</label>
                            <select name="daysSincePosted" class="form-control">
                                <option value="">Any Time</option>
                                <option value="1" th:selected="${param.daysSincePosted == '1'}">Last 24 Hours</option>
                                <option value="7" th:selected="${param.daysSincePosted == '7'}">Last 7 Days</option>
                                <option value="30" th:selected="${param.daysSincePosted == '30'}">Last 30 Days</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 1rem; align-items: flex-end;">
                            <button type="submit" class="btn btn-primary"
                                style="width: 100%; height: 45px; padding: 0px;">Apply
                                Filters</button>
                        </div>
                    </div>
                </div>
            </form>

            <div th:each="job : ${jobs}" class="job-card-compact">
                <div class="job-card-info">
                    <div style="display: flex; align-items: baseline;">
                        <h4 th:text="${job.title}">Senior Developer</h4>
                        <span class="company" th:text="${job.company.name}" style="margin-left: 1rem;">TechCorp
                            Inc.</span>
                    </div>
                    <div class="job-card-meta">
                        <span class="tag" th:text="${job.jobType}">Full Time</span>
                        <span><i class="fas fa-map-marker-alt"></i> <span th:text="${job.location}">Remote</span></span>
                        <span><i class="fas fa-briefcase"></i> <span
                                th:text="${job.experienceRequired + '+ years exp'}">3+ years</span></span>
                        <span th:if="${job.salaryRange}"><i class="fas fa-money-bill-wave"></i> <span
                                th:text="${job.salaryRange}">$120k - $150k</span></span>
                        <span th:if="${job.deadline != null}"><i class="far fa-calendar-alt"></i> Deadline: <span
                                th:text="${job.deadline}">2026-12-31</span></span>
                    </div>
                </div>
                <div class="job-card-actions">
                    <form th:action="@{'/seeker/jobs/' + ${job.id} + '/favorite'}" method="post"
                        style="display: inline;">
                        <button type="submit" class="btn"
                            th:classappend="${favoriteJobIds != null and favoriteJobIds.contains(job.id)} ? 'btn-primary' : 'btn-outline'"
                            style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem;"
                            th:text="${favoriteJobIds != null and favoriteJobIds.contains(job.id)} ? 'Saved' : 'Save'"></button>
                    </form>
                    <a th:href="@{'/seeker/jobs/' + ${job.id}}" class="btn btn-primary"
                        style="width: auto; padding: 0.5rem 1.5rem; font-size: 0.85rem;">View Details</a>
                </div>
            </div>

            <div th:if="${jobs.empty}" style="text-align: center; padding: 4rem;">
                <p style="color: #94a3b8;">No jobs found. Try adjusting your search filters.</p>
            </div>
        </main>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
