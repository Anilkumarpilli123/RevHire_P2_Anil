<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .profile-form {
            max-width: 800px;
        }

        .section-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
        }
    </style>
</head>

<body>
    <div th:replace="~{common/fragments :: mobile-header('employer')}"></div>
    <div th:replace="~{common/fragments :: sidebar-overlay}"></div>
    <div class="container">
        <div th:replace="~{common/fragments :: employer-sidebar('profile')}"></div>

        <main class="main-content">
            <header style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                <a href="/employer/profile"
                    style="color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-arrow-left"></i> Back to Profile
                </a>
            </header>

            <h1>Edit Profile</h1>
            <p style="color: #94a3b8; margin-bottom: 3rem;">Update your personal and company details.</p>

            <form th:action="@{/employer/profile}" method="post" class="profile-form">
                <!-- Personal Details Section -->
                <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-user-tie"></i> Personal Details</h3>
                <div class="section-card">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="personalName" th:value="${profile.name}" class="form-control"
                                placeholder="Your full name" required>
                        </div>
                        <div class="form-group">
                            <label>Professional Role</label>
                            <input type="text" name="jobRole" th:value="${profile.jobRole}" class="form-control"
                                placeholder="e.g. HR Manager, Tech Lead">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" name="personalPhone" th:value="${profile.phone}" class="form-control"
                                placeholder="e.g. +91 9876543210">
                        </div>
                        <div class="form-group">
                            <label>Personal Location</label>
                            <input type="text" name="personalLocation" th:value="${profile.location}"
                                class="form-control" placeholder="e.g. Hyderabad, India">
                        </div>
                    </div>
                </div>

                <!-- Company Details Section -->
                <h3 style="margin-bottom: 1.5rem;"><i class="fas fa-building"></i> Company Information</h3>
                <div class="section-card">
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" name="name" th:value="${profile.company?.name}" class="form-control" required
                            placeholder="Your organization name">
                    </div>
                    <div class="form-group">
                        <label>Industry</label>
                        <input type="text" name="industry" th:value="${profile.company?.industry}" class="form-control"
                            placeholder="e.g. Technology, Finance">
                    </div>
                    <div class="form-group">
                        <label>Company Mission & Culture</label>
                        <textarea name="description" th:text="${profile.company?.description}" class="form-control"
                            placeholder="Tell us about your company culture, mission, and vision..."
                            style="min-height: 100px;"></textarea>
                    </div>
                </div>

                <div class="section-card">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Company Website</label>
                            <input type="url" name="website" th:value="${profile.company?.website}" class="form-control"
                                placeholder="https://example.com">
                        </div>
                        <div class="form-group">
                            <label>Office Location</label>
                            <input type="text" name="location" th:value="${profile.company?.location}"
                                class="form-control" placeholder="e.g. San Francisco, US">
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 1.5rem; margin-bottom: 3rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Save Changes</button>
                    <a href="/employer/profile" class="btn btn-outline"
                        style="flex: 1; border: 1px solid var(--glass-border); text-align: center; line-height: 1; padding: 0.8rem; text-decoration: none; color: white;">Cancel</a>
                </div>
            </form>
        </main>
    </div>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
