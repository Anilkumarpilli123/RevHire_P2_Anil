<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RevHire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="glass-container auth-card">
            <div class="auth-header">
                <a href="/" style="text-decoration: none;">
                    <h2 class="logo"
                        style="background: linear-gradient(to right, var(--primary), var(--secondary));-webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">
                        RevHire</h2>
                </a>
                <h2>Create New Password</h2>
                <p>Enter your new secure password</p>
            </div>

            <div th:if="${error}" class="alert error-text" style="text-align: center; margin-bottom: 1rem;">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                <input type="hidden" th:field="*{token}">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" th:field="*{newPassword}" class="form-control" placeholder="••••••••"
                        required>
                    <small style="color: grey; font-size: 0.75rem;">Min 8 chars, must include Uppercase, Lowercase,
                        Number and Special char.</small>
                </div>
                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
        </div>
    </div>
</body>

</html>
